# Alembic configuration file.
#
# Used by Alembic to manage database schema migrations.
# Most configuration is controlled via app/core/config.py (not this file).
# The sqlalchemy.url below is overridden in alembic/env.py using settings.DATABASE_URL.
#
# Reference commands:
#   alembic revision --autogenerate -m "describe the change"  # Generate migration
#   alembic upgrade head                                        # Apply all pending migrations
#   alembic upgrade head --sql                                  # Preview SQL without running
#   alembic downgrade -1                                        # Roll back one migration
#   alembic current                                             # Show current DB migration state
#   alembic history --verbose                                   # Show full migration history

[alembic]
script_location = alembic

# Migration file naming: sortable timestamp + description slug
# Example: 20261105_143000_create_organizations_table.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

timezone = UTC

# Prepend backend/ root to sys.path so "app" package is importable during migration runs
prepend_sys_path = .

# Version path separator for multi-directory migration support (not in use)
version_path_separator = os

# Placeholder — overridden in alembic/env.py from settings.DATABASE_URL
sqlalchemy.url = placeholder://overridden_in_env_py


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

