# =============================================================================
# Supabase CLI Local Development Configuration
# =============================================================================
# Used when running `supabase start` for local development and storage emulation.

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[auth]
# We issue custom JWTs via FastAPI backend. Supabase auth endpoints are disabled.
enabled = false

[storage]
enabled = true
# 4MB limit per user decision Q11 (4 * 1024 * 1024 = 4194304 bytes)
file_size_limit = "4MiB"

[storage.buckets.lms-dev]
public = false
file_size_limit = "4MiB"
allowed_mime_types = ["application/pdf", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"]

